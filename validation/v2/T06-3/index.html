<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <title>HAIGURE SURVIVAL v2 T06-3 ミニマップ検証</title>
  </head>
  <body>
    <main>
      <aside class="panel">
        <p class="eyebrow">HAIGURE SURVIVAL v2</p>
        <h1>T06-3 ミニマップ検証</h1>
        <p id="summary" data-state="running">検証準備中です。</p>
        <button id="run-validation" type="button">検証を再実行</button>

        <section aria-labelledby="floor-heading">
          <h2 id="floor-heading">表示階</h2>
          <div id="floor-tabs" class="floor-tabs" role="tablist">
            <button type="button" role="tab" data-floor-id="f01">1F</button>
            <button type="button" role="tab" data-floor-id="f02">2F</button>
            <button type="button" role="tab" data-floor-id="f03">3F</button>
            <button type="button" role="tab" data-floor-id="f04">4F</button>
            <button type="button" role="tab" data-floor-id="roof">屋上</button>
          </div>
        </section>

        <section aria-labelledby="metrics-heading">
          <h2 id="metrics-heading">結果</h2>
          <dl id="metrics"></dl>
          <ol id="check-results" aria-live="polite"></ol>
        </section>
      </aside>

      <section class="viewport" aria-label="T06-3ミニマップ表示">
        <div class="map-shell">
          <canvas id="minimap-canvas"></canvas>
          <div id="minimap-readout"></div>
        </div>
        <p class="legend">
          白: プレイヤー　水色: Follower　黄: NPC　橙: BIT　桃: Mission
        </p>
        <canvas id="render-canvas" aria-hidden="true"></canvas>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
