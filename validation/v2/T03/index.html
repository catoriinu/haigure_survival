<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <title>HAIGURE SURVIVAL v2 T03 Validation</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>T03 プレイヤー高さ検証</h1>
        <p id="summary">検証準備中</p>
        <dl id="metrics"></dl>
        <div class="controls">
          <button id="run-validation" type="button">自動検証を再実行</button>
          <button id="load-flat" type="button">平面Mesh</button>
          <button id="load-glb" type="button">T01 GLB</button>
          <button data-position="spawn" type="button">入口</button>
          <button data-position="step" type="button">中央段差前</button>
          <button data-position="slope-low" type="button">斜面下</button>
          <button data-position="slope-high" type="button">斜面踊り場</button>
          <button data-position="stair-low" type="button">階段下</button>
          <button data-position="stair-high" type="button">階段踊り場</button>
          <button data-position="wall" type="button">壁前</button>
        </div>
        <p>WASD: 移動 / マウス: 視点</p>
        <ol id="results"></ol>
      </section>
      <canvas id="render-canvas"></canvas>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
