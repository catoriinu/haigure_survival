<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'"
    />
    <title>HAIGURE SURVIVAL v2 T06-4 Mission・放送検証</title>
  </head>
  <body>
    <main>
      <aside class="panel">
        <p class="eyebrow">HAIGURE SURVIVAL v2</p>
        <h1>T06-4 Mission・放送検証</h1>
        <p id="summary" class="summary" data-state="running">検証準備中です。</p>
        <button id="run-validation" type="button">検証を再実行</button>
        <section aria-labelledby="metrics-heading">
          <h2 id="metrics-heading">結果</h2>
          <dl id="metrics" class="metrics"></dl>
          <ol id="check-results" class="check-results" aria-live="polite"></ol>
        </section>
      </aside>
      <section class="viewport" aria-label="T06-4検証概要">
        <div class="card-grid">
          <article><h2>Player Mission</h2><p>20秒scheduler・通常3件・状況1件</p></article>
          <article><h2>NPC Mission</h2><p>通常8件・放送枠外・優先順位</p></article>
          <article><h2>校内放送</h2><p>体育館・逃走・ハイグレ人間化</p></article>
          <article><h2>HUD / Minimap</h2><p>右上一覧・Actor／Location目標</p></article>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
